name: Windows verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: packages/generator/templates/go/go.sum

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: x64

      - name: Install pinned pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager --no-audit --no-fund
          node -p "process.platform + ' ' + process.arch + ' Node.js ' + process.version"
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit, filesystem, and Git integration tests
        run: |
          git --version
          pnpm test --maxWorkers=2 --testTimeout=15000

      - name: Build desktop application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @factory/desktop exec playwright install chromium

      - name: Verify standalone generated application with PostgreSQL
        env:
          FACTORY_REQUIRE_DATABASE: '1'
          FACTORY_STARTER_BROWSER: '1'
        run: |
          $env:FACTORY_TEST_DATABASE_URL = ./scripts/start-windows-verification-database.ps1
          pnpm exec vitest run --maxWorkers=2 --testTimeout=15000 apps/desktop/src/main/services/schema/studio.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Database Studio PostgreSQL integration failed.' }
          pnpm verify:starter
          if ($LASTEXITCODE -ne 0) { throw 'Standalone starter verification failed.' }

      - name: Test renderer
        run: pnpm test:renderer --workers=2

      - name: Install Electron binary
        run: pnpm --filter @factory/desktop exec install-electron

      - name: Test native Electron
        env:
          FACTORY_TEST_PUBLIC_HTTPS: '1'
        run: pnpm test:electron

      - name: Upload desktop workspace screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-desktop-workspaces
          path: |
            apps/desktop/test-results/**/project-*.png
            apps/desktop/test-results/**/git-studio-*.png
            apps/desktop/test-results/**/new-project-*.png
            apps/desktop/test-results/**/database-studio-*.png
            apps/desktop/test-results/**/generation-review-*.png
            apps/desktop/test-results/**/developer-*.png
            apps/desktop/test-results/**/delivery-*.png
            apps/desktop/test-results/**/engineering-library-*.png
            apps/desktop/test-results/**/technology-catalog-*.png
          retention-days: 7
