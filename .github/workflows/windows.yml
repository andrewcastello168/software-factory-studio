name: Windows verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: x64

      - name: Diagnose Windows stat identity
        run: |
          @'
          const fs = require('node:fs/promises');
          const os = require('node:os');
          const path = require('node:path');
          (async () => {
            const directory = await fs.mkdtemp(path.join(os.tmpdir(), 'factory-stat-'));
            const file = path.join(directory, 'preferences.json');
            const summarize = (stats) => ({
              file: stats.isFile(),
              dev: stats.dev.toString(16),
              ino: stats.ino.toString(16),
              birthtime: stats.birthtimeNs.toString(16)
            });
            try {
              await fs.writeFile(file, '{}');
              const handle = await fs.open(file, 'r');
              try {
                console.log('FACTORY_STAT', JSON.stringify({
                  lstat: summarize(await fs.lstat(file, {bigint: true})),
                  stat: summarize(await fs.stat(file, {bigint: true})),
                  fstat: summarize(await handle.stat({bigint: true})),
                }));
              } finally {
                await handle.close();
              }
            } finally {
              await fs.rm(directory, {recursive: true, force: true});
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          '@ | node

      - name: Install pinned pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager --no-audit --no-fund
          node -p "process.platform + ' ' + process.arch + ' Node.js ' + process.version"
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and filesystem integration tests
        run: pnpm test

      - name: Build desktop application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @factory/desktop exec playwright install chromium

      - name: Test renderer
        run: pnpm test:renderer --workers=2

      - name: Install Electron binary
        run: pnpm --filter @factory/desktop exec install-electron

      - name: Test native Electron
        run: pnpm test:electron
