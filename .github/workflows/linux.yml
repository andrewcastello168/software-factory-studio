name: Linux verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_DB: factory_check
          POSTGRES_USER: factory_test
          POSTGRES_PASSWORD: local-ci-fixture-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U factory_test -d factory_check"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: x64

      - name: Install pinned pnpm and workspace dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --no-audit --no-fund
          pnpm install --frozen-lockfile

      - name: Verify application
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Verify standalone generated application
        env:
          FACTORY_REQUIRE_DATABASE: '1'
          FACTORY_TEST_DATABASE_URL: postgresql://factory_test:local-ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/factory_check
        run: pnpm verify:starter
