name: Linux verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: x64

      - name: Install pinned pnpm and workspace dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --no-audit --no-fund
          pnpm install --frozen-lockfile

      - name: Verify application
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
