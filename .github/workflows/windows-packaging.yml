name: Windows installer verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Install and verify Windows x64 RC
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 28
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: packages/generator/templates/go/go.sum

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: x64

      - name: Install frozen workspace
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager --no-audit --no-fund
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Compile production application
        run: pnpm build

      - name: Build unsigned candidate and verify provenance
        run: |
          pnpm package:windows
          if ($LASTEXITCODE -ne 0) { throw 'Candidate packaging failed.' }
          $release = 'apps/desktop/dist/windows-release'
          $evidence = Get-Content "$release/build-evidence.json" -Raw | ConvertFrom-Json
          $installer = Join-Path $release $evidence.artifact
          $signature = (Get-AuthenticodeSignature $installer).Status.ToString()
          if ($signature -ne 'NotSigned' -or $evidence.signingRequested -or -not $evidence.workingTreeClean) { throw 'Expected an unsigned RC.' }
          if ((Get-FileHash $installer).Hash.ToLowerInvariant() -ne $evidence.sha256 -or
              (Get-Item $installer).Length -ne $evidence.bytes -or $evidence.source -ne (git rev-parse HEAD)) {
            throw 'Installer bytes and provenance do not match the evidence.'
          }
          $evidence | Add-Member -NotePropertyName authenticode -NotePropertyValue $signature
          $evidence | Add-Member -NotePropertyName windowsVersion -NotePropertyValue ([Environment]::OSVersion.VersionString)
          $evidence | ConvertTo-Json -Depth 4 | Set-Content "$release/build-evidence.json"
          $evidence | ConvertTo-Json -Depth 4 | Write-Output

      - name: Install, upgrade, uninstall and reinstall Studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = 'apps/desktop/dist/windows-release'
          $evidence = Get-Content "$release/build-evidence.json" -Raw | ConvertFrom-Json
          $candidate = Join-Path $release $evidence.artifact
          $historicalArtifact = 15173153152
          $expires = [DateTimeOffset]::Parse('2026-12-27T04:47:55Z')
          if ([DateTimeOffset]::UtcNow -lt $expires) {
            $baseline = Join-Path $env:RUNNER_TEMP 'studio-rc1'
            $previousVersion = '1.0.0-rc.1'
            $uri = "$env:GITHUB_API_URL/repos/andrewcastello168/software-factory-studio/actions/artifacts/$historicalArtifact/zip"
            # PowerShell drops Authorization when following the redirect to the artifact storage host.
            Invoke-WebRequest -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -TimeoutSec 180 -OutFile "$baseline.zip"
            if ((Get-FileHash "$baseline.zip").Hash -ne 'd7655f8760723b5b6247c6f95fcefd50cb1a2456ba437a8a651e7e3a0bb9e247') {
              throw 'The archived RC ZIP does not match the pinned checksum.'
            }
            Expand-Archive -LiteralPath "$baseline.zip" -DestinationPath $baseline
            $previous = Join-Path $baseline 'Software-Factory-Studio-1.0.0-rc.1-windows-x64.exe'
            if ((Get-FileHash $previous).Hash -ne '008fb64edfd846d5b72d402343ab7487d46cbc419234cc6598522c69ed00a7df') {
              throw 'The rc.1 installer does not match the pinned checksum.'
            }
            $upgrade = 'historical-rc-1'
          } else {
            # Earlier workflow artifacts expire. Keep the installer lifecycle check and label its limited scope.
            Remove-Item Env:GH_TOKEN
            pnpm package:windows --upgrade-fixture
            if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture packaging failed.' }
            $previous = 'apps/desktop/dist/upgrade-fixture/Software-Factory-Studio-1.0.0-rc.0-windows-x64.exe'
            $previousVersion = '1.0.0-rc.0'
            $upgrade = 'same-source-fixture'
          }
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          foreach ($bundle in @('main', 'preload', 'renderer')) {
            Move-Item "apps/desktop/dist/$bundle" (Join-Path $env:RUNNER_TEMP "studio-unpackaged-$bundle")
          }
          ./scripts/verify-windows-installer.ps1 -Candidate $candidate -Previous $previous -PreviousVersion $previousVersion -DisposableAccount
          $evidence | Add-Member -NotePropertyName upgrade -NotePropertyValue $upgrade
          $evidence | Add-Member -NotePropertyName previousVersion -NotePropertyValue $previousVersion
          $evidence | ConvertTo-Json -Depth 4 | Set-Content "$release/build-evidence.json"
          Write-Output "Installer upgrade verified from $previousVersion ($upgrade)."

      - name: Install Playwright Chromium
        run: pnpm --filter @factory/desktop exec playwright install chromium

      - name: Verify installed workflows and their generated applications
        env:
          FACTORY_TEST_PUBLIC_HTTPS: '1'
          FACTORY_REQUIRE_DATABASE: '1'
          FACTORY_STARTER_BROWSER: '1'
        run: |
          $env:FACTORY_INSTALLED_EXECUTABLE = Join-Path $env:LOCALAPPDATA 'Programs/Software Factory Studio/Software Factory Studio.exe'
          $env:FACTORY_INSTALLED_FIXTURES = Join-Path $env:RUNNER_TEMP 'studio-installed-output'
          New-Item -Path $env:FACTORY_INSTALLED_FIXTURES -ItemType Directory | Out-Null
          pnpm test:electron
          if ($LASTEXITCODE -ne 0) { throw 'Installed workflow tests failed.' }
          $env:FACTORY_TEST_DATABASE_URL = ./scripts/start-windows-verification-database.ps1
          pnpm verify:starter

      - name: Upload verified installer and build evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: software-factory-studio-windows-x64-rc
          path: |
            apps/desktop/dist/windows-release/Software-Factory-Studio-*-windows-x64.exe
            apps/desktop/dist/windows-release/Software-Factory-Studio-*-windows-x64.exe.sha256
            apps/desktop/dist/windows-release/build-evidence.json
            apps/desktop/dist/windows-release/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload installed application screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-windows-workspaces
          path: |
            apps/desktop/dist/installer-evidence/**/installed-*.png
            apps/desktop/test-results/**/*.png
          retention-days: 30
